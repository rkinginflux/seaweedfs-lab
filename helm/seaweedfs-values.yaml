# Helm values for SeaweedFS 4.48 (chart `seaweedfs/seaweedfs`).
#
# Everything except the volume data lives on `local-path` PVCs; the volume server
# keeps its data on a local-path PVC too, which means the data is node-local and
# NOT highly available. See docs/architecture.md for why that matters.
#
# Pre-create these secrets in the target namespace (no credentials in this repo):
#   seaweedfs-admin-secret        keys: adminUser, adminPassword
#   seaweedfs-admin-access-s3     keys: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   seaweedfs-s3-secret           keys: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
namespace:
  - name: s3

master:
  enabled: true
  data:
    type: persistentVolumeClaim
    storageClass: local-path
    size: 5Gi
  logs:
    type: persistentVolumeClaim
    storageClass: local-path
    size: 1Gi
  tolerations: "- key: \"dedicated\"\n  operator: \"Equal\"\n  value: \"seaweedfs\"\n  effect: \"NoSchedule\"\n"

filer:
  enabled: true
  data:
    type: persistentVolumeClaim
    storageClass: local-path
    size: 5Gi
  logs:
    type: persistentVolumeClaim
    storageClass: local-path
    size: 1Gi
  s3:
    enabled: true
    enableAuth: true
    createBuckets:
      - name: lab
        versioning: Enabled
  tolerations: "- key: \"dedicated\"\n  operator: \"Equal\"\n  value: \"seaweedfs\"\n  effect: \"NoSchedule\"\n"

volume:
  # One volume server, 220 volume slots, 50Gi claim. The claim is NOT a filesystem
  # quota: SeaweedFS stops writing when maxVolumes is reached, not at the PVC size.
  #
  # Size the slots against the VOLUME size, not the disk. This chart sets
  # volumeSizeLimitMB: 1000, so each slot is 1 GB even though the weed version
  # string advertises 30 GB. Two outages came from getting this wrong:
  #   35/35 slots  -> S3 PUTs 500, ingester stalled
  #   46/46 slots  -> same failure again, three hours later, at ~8 GB/h growth
  # 220 slots = a 220 GB ceiling, which fits the ~343 GB free on the volume node.
  #
  # If slot churn becomes a problem again, raise volumeSizeLimitMB rather than
  # maxVolumes: 4000 MB volumes would burn a quarter of the ids for the same data.
  # Watch free slots as `free_volume_slots` (seaweedfs_cluster) — it is also what
  # the "SeaweedFS volume slots low" alert fires on.
  dataDirs:
    - name: data1
      type: persistentVolumeClaim
      storageClass: local-path
      size: 50Gi
      maxVolumes: 220
  tolerations: "- key: \"dedicated\"\n  operator: \"Equal\"\n  value: \"seaweedfs\"\n  effect: \"NoSchedule\"\n"

admin:
  enabled: true
  data:
    type: persistentVolumeClaim
    storageClass: local-path
    size: 5Gi
  logs:
    type: persistentVolumeClaim
    storageClass: local-path
    size: 1Gi
  secret:
    existingSecret: seaweedfs-admin-secret
    userKey: adminUser
    pwKey: adminPassword
  tolerations: "- key: \"dedicated\"\n  operator: \"Equal\"\n  value: \"seaweedfs\"\n  effect: \"NoSchedule\"\n"

worker:
  # SeaweedFS maintenance workers: vacuum deleted needles, rebalance volumes
  enabled: true
  replicas: 2
  jobType: vacuum,volume_balance
  tolerations: "- key: \"dedicated\"\n  operator: \"Equal\"\n  value: \"seaweedfs\"\n  effect: \"NoSchedule\"\n"

s3:
  credentials:
    admin:
      existingSecret: seaweedfs-admin-access-s3
      accessKeyKey: AWS_ACCESS_KEY_ID
      secretKeyKey: AWS_SECRET_ACCESS_KEY
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    storageClass: local-path
    size: 5Gi
    objectStorage:
      type: file
