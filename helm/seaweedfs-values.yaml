# Helm values for SeaweedFS 4.48 (chart `seaweedfs/seaweedfs`).
#
# Persistence is node-local: the volume server keeps its existing data1 PVC plus
# getup's /misc/object_store hostPath. This is NOT highly available.
# See docs/architecture.md and the /misc boot-mount warning in docs/runbook.md.
#
# Pre-create these secrets in the target namespace (no credentials in this repo):
#   seaweedfs-admin-secret        keys: adminUser, adminPassword
#   seaweedfs-admin-access-s3     keys: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   seaweedfs-s3-secret           keys: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
namespace:
  - name: s3

master:
  # Volume size cap, applied by the master (the chart passes -volumeSizeLimitMB to the
  # master only; volume servers keep their own 30 GB default, so this is the binding limit).
  #
  # 1000 -> 4000: volume ids are the scarce resource in this lab, not disk. At 1 GB a slot
  # held 1 GB, so the 7-day retention (~1.15 TB at 6.8 GB/h) needed ~1150 of the 1720 slots,
  # and every new volume cost the master a slot and the vacuum worker a rewrite. At 4 GB the
  # same data is ~290 volumes: a quarter of the ids, a quarter of the metadata churn, and the
  # disk becomes the binding limit instead of the slot count (220 x 4 GB = 880 GB on data1,
  # 1500 x 4 GB = 6 TB on /misc, both larger than the disks they sit on).
  #
  # Only volumes created after this change get 4 GB. Volumes already full at 1 GB stay
  # read-only; the master hands out new 4 GB ones as the writable pool drains, so the switch
  # is gradual and needs no migration.
  #
  # Trade-off: a vacuum or compaction job on a 4 GB volume moves 4x the data, and partially
  # deleted volumes only reclaim space when they are rewritten. At this scale that is a
  # minute of worker time, not a capacity problem.
  volumeSizeLimitMB: 4000
  enabled: true
  data:
    type: persistentVolumeClaim
    storageClass: local-path
    size: 5Gi
  logs:
    type: persistentVolumeClaim
    storageClass: local-path
    size: 1Gi
  tolerations: "- key: \"dedicated\"\n  operator: \"Equal\"\n  value: \"seaweedfs\"\n  effect: \"NoSchedule\"\n"

filer:
  enabled: true
  data:
    type: persistentVolumeClaim
    storageClass: local-path
    size: 5Gi
  logs:
    type: persistentVolumeClaim
    storageClass: local-path
    size: 1Gi
  s3:
    enabled: true
    enableAuth: true
    createBuckets:
      - name: lab
        versioning: Enabled
  tolerations: "- key: \"dedicated\"\n  operator: \"Equal\"\n  value: \"seaweedfs\"\n  effect: \"NoSchedule\"\n"

volume:
  # One volume server, two data directories, 1720 volume slots in total.
  # The data1 50Gi claim is NOT a filesystem quota. Both slot and disk limits apply.
  #
  # Size the slots against the VOLUME size, not the disk. This chart sets
  # volumeSizeLimitMB: 1000, so each slot is 1 GB even though the weed version
  # string advertises 30 GB. Two outages came from getting this wrong:
  #   35/35 slots  -> S3 PUTs 500, ingester stalled
  #   46/46 slots  -> same failure again, three hours later, at ~8 GB/h growth
  # data1 retains 220 slots; /misc adds 1500 with disk headroom on the 1.8 TiB disk.
  # No nodeSelector: the existing data1 PV's node affinity already selects getup.
  # On a fresh cluster, ensure the data1 PV is bound to the node holding /misc;
  # this values file alone does not guarantee correct first-time placement.
  #
  # If slot churn becomes a problem again, raise volumeSizeLimitMB rather than
  # maxVolumes: 4000 MB volumes would burn a quarter of the ids for the same data.
  # Watch free slots as `free_volume_slots` (seaweedfs_cluster) — it is also what
  # the "SeaweedFS volume slots low" alert fires on.
  dataDirs:
    - name: data1
      type: persistentVolumeClaim
      storageClass: local-path
      size: 50Gi
      maxVolumes: 220
    - name: misc
      type: hostPath
      hostPathPrefix: /misc
      maxVolumes: 1500
  # The chart appends /object_store/ to hostPathPrefix and mounts it at /misc.
  # Fail closed if /misc is on the root-backed data1 filesystem after a reboot.
  # This guard depends on data1 remaining root-backed; it does not mount the disk.
  initContainers: |
    - name: verify-misc-disk
      image: chrislusf/seaweedfs:4.48
      command:
        - /bin/sh
        - -ec
        - |
          data_device=$(stat -c %d /data1)
          misc_device=$(stat -c %d /misc)
          if [ "$data_device" = "$misc_device" ]; then
            echo 'ERROR: /misc is not a separate disk; refusing to start' >&2
            exit 1
          fi
          df -k /misc
      volumeMounts:
        - name: data1
          mountPath: /data1
          readOnly: true
        - name: misc
          mountPath: /misc
          readOnly: true
  tolerations: "- key: \"dedicated\"\n  operator: \"Equal\"\n  value: \"seaweedfs\"\n  effect: \"NoSchedule\"\n"

admin:
  enabled: true
  data:
    type: persistentVolumeClaim
    storageClass: local-path
    size: 5Gi
  logs:
    type: persistentVolumeClaim
    storageClass: local-path
    size: 1Gi
  secret:
    existingSecret: seaweedfs-admin-secret
    userKey: adminUser
    pwKey: adminPassword
  tolerations: "- key: \"dedicated\"\n  operator: \"Equal\"\n  value: \"seaweedfs\"\n  effect: \"NoSchedule\"\n"

worker:
  # SeaweedFS maintenance workers: vacuum deleted needles, rebalance volumes
  enabled: true
  replicas: 2
  jobType: vacuum,volume_balance
  tolerations: "- key: \"dedicated\"\n  operator: \"Equal\"\n  value: \"seaweedfs\"\n  effect: \"NoSchedule\"\n"

s3:
  credentials:
    admin:
      existingSecret: seaweedfs-admin-access-s3
      accessKeyKey: AWS_ACCESS_KEY_ID
      secretKeyKey: AWS_SECRET_ACCESS_KEY
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    storageClass: local-path
    size: 5Gi
    objectStorage:
      type: file
