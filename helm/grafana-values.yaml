# Helm values for Grafana 13 (chart `grafana/grafana`).
#
# Plain HTTP behind a node-pinned nginx proxy on a trusted LAN. The admin password is
# NOT here: the chart generates one into the `grafana/grafana` Secret
# (keys `admin-user`, `admin-password`).
#
# The proxy is created through `extraObjects` because the cluster has no ingress
# controller; hostPort keeps it inside the normal range and nodeSelector pins it so the
# port is only claimed on one node.
# Local Kubernetes Grafana deployment; plain HTTP is for a trusted LAN only.
replicas: 1
service:
  type: ClusterIP
# A small node-pinned reverse proxy exposes :3000 outside the NodePort range.
extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: grafana-lan-proxy
    data:
      default.conf: |
        server {
          listen 8080;
          location / {
            proxy_pass http://grafana.grafana.svc.cluster.local:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
          }
        }
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: grafana-lan-proxy
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: grafana-lan-proxy
      template:
        metadata:
          labels:
            app: grafana-lan-proxy
        spec:
          nodeSelector:
            kubernetes.io/hostname: eruption
          containers:
            - name: proxy
              image: nginxinc/nginx-unprivileged:1.29-alpine
              ports:
                - containerPort: 8080
                  hostPort: 3000
                  protocol: TCP
              volumeMounts:
                - name: config
                  mountPath: /etc/nginx/conf.d/default.conf
                  subPath: default.conf
              readinessProbe:
                httpGet:
                  path: /api/health
                  port: 8080
              livenessProbe:
                httpGet:
                  path: /api/health
                  port: 8080
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
          volumes:
            - name: config
              configMap:
                name: grafana-lan-proxy
persistence:
  enabled: true
  storageClassName: local-path
  size: 5Gi
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
